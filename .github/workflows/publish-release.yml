name: Publish portable release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eagleprtsc-release-v5.12
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: v5.12
      PACKAGE_FILE: EaglePrtSc-v5.12.zip
      PACKAGE_BLOB: 2d78091827632135ea3a5282c9218c9d6a6c3b43
      PACKAGE_SHA256: 0f3532d8dca8caea138abcf98dfe280777462074f16b34257086a1e59ffc46a1
    steps:
      - name: Verify package, upload assets, and publish
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          PACKAGE_ASSET_ID=""
          if [ -n "$RELEASE_ID" ]; then
            PACKAGE_ASSET_ID="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq ".assets[] | select(.name == \"$PACKAGE_FILE\") | .id")"
          fi
          if [ -n "$PACKAGE_ASSET_ID" ]; then
            gh release download "$TAG" --repo "$GH_REPO" --pattern "$PACKAGE_FILE"
          else
            gh api "repos/$GH_REPO/git/blobs/$PACKAGE_BLOB" --jq .content > package.b64
            base64 --decode package.b64 > "$PACKAGE_FILE"
          fi
          printf '%s  %s\n' "$PACKAGE_SHA256" "$PACKAGE_FILE" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Windows 截图与录制工具，含中文设置界面。
          
          本次更新：取消截图、录制开始和保存完成的提示音；导入及录制错误改为无声文字提示，错误提示保留五秒。已保存的视频参数保持原值。
          
          - 双击 PrtSc 截图并导入 Eagle；长按开始或停止录制。
          - 支持图片格式、分辨率比例、视频画质 / 码率、帧率（最高 200 fps）、电脑声音、鼠标显示和锐化设置。
          - 默认 60 fps，录制电脑声音，不录麦克风。
          - 首次启动自动检查并安装缺少的 FFmpeg / ffprobe，可在设置中注册开机启动。
          - 入库校验后清理本地缓存，导入失败时保留原文件。
          
          下载 EaglePrtSc-v5.12.zip，解压后打开 EaglePrtSc.exe；需单独安装并运行 Eagle。
          SHA256SUMS.txt 提供便携包校验值。源码可下载本页自动生成的 Source code。
          首次自动联网安装仍需在正常 Windows 桌面环境确认。
          NOTES
          RELEASE_ID="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID="$(gh api "repos/$GH_REPO/releases" --method POST --field draft=true --raw-field tag_name="$TAG" --raw-field target_commitish="$GITHUB_SHA" --raw-field name="EaglePrtSc $TAG" --raw-field body="$(cat release-notes.md)" --jq .id)"
          fi
          test -n "$RELEASE_ID"
          for FILE in "$PACKAGE_FILE" SHA256SUMS.txt; do
            EXPECTED="sha256:$(sha256sum "$FILE" | cut -d ' ' -f 1)"
            ASSET_ID="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq ".assets[] | select(.name == \"$FILE\") | .id")"
            if [ -z "$ASSET_ID" ]; then
              gh release upload "$TAG" "$FILE" --repo "$GH_REPO"
            fi
            for ATTEMPT in 1 2 3 4 5; do
              ACTUAL="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq ".assets[] | select(.name == \"$FILE\") | .digest")"
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                break
              fi
              if [ "$ACTUAL" != "null" ] && [ -n "$ACTUAL" ]; then
                printf 'Asset hash mismatch: %s\n' "$FILE" >&2
                exit 1
              fi
              sleep 2
            done
            test "$ACTUAL" = "$EXPECTED"
          done
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --latest
          printf 'Published https://github.com/%s/releases/tag/%s\n' "$GH_REPO" "$TAG"
